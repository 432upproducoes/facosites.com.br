  <script>
    function updateThemeColor() {
      const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const themeColor = isDarkMode ? '#141414' : '#F4F1EA';
      let metaTheme = document.querySelector('meta[name="theme-color"]');
      if (!metaTheme) {
        metaTheme = document.createElement('meta');
        metaTheme.name = 'theme-color';
        document.head.appendChild(metaTheme);
      }
      metaTheme.setAttribute('content', themeColor);
    }

    let audioCtx = null;
    let audioBuffer = null;

    async function initAudioEngine() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const response = await fetch('katana-draw.mp3');
        const arrayBuffer = await response.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateThemeColor();
    });

    // Carrega o áudio apenas no primeiro toque (melhor performance)
    let audioReady = false;
    function ensureAudio() {
      if (!audioReady) {
        audioReady = true;
        initAudioEngine();
      }
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor);

    function playInstantSound() {
      ensureAudio();
      if (audioCtx && audioBuffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.7;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
      } else {
        const fallback = new Audio('katana-draw.mp3');
        fallback.volume = 0.7;
        fallback.play().catch(() => {});
      }
    }

    /* ===== MODAL GRANDE — MESMO MECANISMO DO SEU ARQUIVO QUE FUNCIONA ===== */
    const overlay = document.getElementById('techOverlay');
    const iframe = document.getElementById('previewIframe');
    const titleEl = document.getElementById('overlayTitle');
    const closeBtn = document.getElementById('closeOverlay');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const openDrawerBtn = document.getElementById('openDrawer');
    const closeDrawerBtn = document.getElementById('closeDrawer');

    let currentProject = 'pedidos'; // 'pedidos' | 'mundos'

    document.addEventListener('pointerdown', (e) => {
      const trigger = e.target.closest('.preview-trigger');
      if (!trigger) return;

      const url = trigger.getAttribute('data-url');
      const siteTitle = trigger.getAttribute('data-title');

      if (url && url !== '') {
        playInstantSound();
        // Define o contexto do projeto para o drawer
        if (url.includes('432up.com')) {
          currentProject = 'mundos';
        } else if (url.includes('/pedidos/')) {
          currentProject = 'pedidos';
        }
        iframe.src = url;
        titleEl.textContent = siteTitle || 'PREVIEW';
        overlay.classList.add('active');
      }
    });

    /* ===== CONTEÚDO MODULAR POR PROJETO ===== */
    const projectContents = {
      pedidos: {
        title: '// FAÇO PEDIDOS',
        html: `
          <h4>FAÇO PEDIDOS</h4>
          <p>Pedidos mais simples. Para quem vende e para quem compra.</p>
          <p>O FAÇO PEDIDOS foi criado para uma dor muito comum de pequenos e médios negócios de alimentação: o cliente quer pedir, mas o caminho até o pedido é complicado.</p>
          <p>Hamburguerias, pizzarias, sorveterias, cafés, mercados e outros negócios muitas vezes acabam dependendo de mensagens no WhatsApp, cardápios confusos ou marketplaces que colocam outra camada entre o estabelecimento e seu cliente.</p>
          <p>O FAÇO PEDIDOS transforma esse processo em uma experiência simples e direta. A ideia é levar o cliente do “quero pedir” até “pedido feito” com o menor número possível de etapas.</p>

          <h4>UM TOQUE</h4>
          <p>A experiência foi pensada para o toque. Menos telas. Menos menus. Menos dúvidas. Menos caminhos desnecessários. Um toque → uma decisão → próximo passo. O objetivo é simplificar a vida de quem está fazendo o pedido.</p>

          <h4>DO TOTEM AO CELULAR</h4>
          <p>O mesmo sistema pode funcionar dentro do estabelecimento, em um totem de autoatendimento, e também no celular do cliente. Isso significa que o cliente pode fazer seu pedido no estabelecimento, pelo próprio celular, de casa, pelo link enviado pelo negócio, e também continuar utilizando o WhatsApp quando essa for a melhor opção.</p>
          <p>A proposta não é obrigar o comerciante a abandonar o WhatsApp. É facilitar o pedido e levar o cliente até a conclusão com muito menos atrito.</p>

          <h4>WHATSAPP SEM A CONVERSA INFINITA</h4>
          <p>Para muitos pequenos negócios, o WhatsApp ainda é o principal canal de vendas. Mas existe uma diferença entre “me manda o cardápio, espera eu responder, escolhe, pergunta preço, confirma endereço…” e uma experiência em que o cliente simplesmente toca → escolhe → confirma → envia.</p>
          <p>O FAÇO PEDIDOS pode organizar essa jornada antes que ela chegue ao atendimento humano. Assim, o WhatsApp continua sendo parte da operação — mas deixa de carregar sozinho todo o trabalho de montar o pedido.</p>

          <h4>SEU PEDIDO. SEU CLIENTE. SUA VENDA.</h4>
          <p>Marketplaces podem ser úteis para conquistar novos clientes. Mas depender exclusivamente deles significa aceitar suas regras, sua experiência e suas taxas. O FAÇO PEDIDOS permite ao estabelecimento criar uma experiência própria de pedidos e vender diretamente ao seu cliente.</p>
          <p>É uma alternativa para quem quer reduzir a dependência de plataformas de terceiros e ter mais controle sobre sua própria operação digital. Em vez de pagar uma comissão recorrente sobre cada venda para simplesmente receber o pedido, o negócio pode ter seu próprio sistema de pedidos. Seu cliente entra pela sua porta digital.</p>

          <h4>SEU PRÓPRIO CANAL DE PEDIDOS</h4>
          <p>O FAÇO PEDIDOS não precisa ser apresentado como “um novo iFood”. A proposta é diferente. É uma ferramenta própria para o negócio vender diretamente.</p>
          <p>Para o comerciante que está cansado de depender de aplicativos, pagar taxas elevadas sobre pedidos e ainda precisar administrar conversas manualmente no WhatsApp, existe outra possibilidade: ter seu próprio canal de pedidos.</p>
          <p>Marketplaces podem cobrar taxas e comissões que pesam sobre cada venda. O foco não é atacar nenhuma empresa. O foco é mostrar que existe uma alternativa: venda direta, experiência própria e mais controle.</p>

          <h4>PARA QUEM FOI FEITO</h4>
          <p>O FAÇO PEDIDOS foi pensado especialmente para negócios como hamburguerias, pizzarias, sorveterias, cafés, mercados, lanchonetes, restaurantes, lojas de alimentação e pequenos negócios que recebem pedidos pelo WhatsApp. É especialmente interessante para quem já vende pelo WhatsApp, mas percebe que o processo está ficando trabalhoso.</p>

          <h4>A IDEIA CENTRAL</h4>
          <p>Não é criar mais uma tela. É eliminar etapas. Não é afastar o cliente. É aproximá-lo do pedido. Não é substituir obrigatoriamente o WhatsApp. É tornar o caminho até ele mais simples. Não é depender de um marketplace. É possibilitar que o negócio tenha sua própria experiência digital de pedidos.</p>
          <p><strong>Menos conversa para montar o pedido. Mais facilidade para fazer o pedido.</strong></p>
        `
      },
      mundos: {
        title: '// FAÇO MUNDOS DIGITAIS',
        html: `
          <h4>FAÇO MUNDOS DIGITAIS</h4>
          <p>Sites que não são apenas páginas. São lugares digitais.</p>
          <p>O FAÇO MUNDOS DIGITAIS cria experiências digitais com identidade, interação, narrativa e propósito.</p>
          <p>Em vez de simplesmente colocar informações em uma página, a proposta é pensar: como essa pessoa vai entrar, descobrir, navegar, interagir e sair dessa experiência?</p>
          <p>Cada projeto pode possuir sua própria linguagem, estrutura, atmosfera e lógica. O site deixa de ser apenas uma vitrine. Pode se transformar em experiência de marca, universo narrativo, apresentação interativa, produto digital, experiência comercial, projeto especial ou ambiente digital personalizado.</p>

          <h4>A IDEIA</h4>
          <p>Se a internet é um espaço, por que todo site precisa parecer uma página?</p>
          <p>O FAÇO MUNDOS DIGITAIS existe para criar experiências que tenham um lugar próprio na web.</p>
          <p><strong>Não é apenas estar na internet. É criar um lugar para estar nela.</strong></p>
        `
      }
    };

    function fillDrawer(projectKey) {
      const data = projectContents[projectKey] || projectContents.pedidos;
      document.getElementById('drawerTitle').textContent = data.title;
      document.getElementById('drawerContent').innerHTML = data.html;
    }

    openDrawerBtn.addEventListener('pointerdown', () => {
      playInstantSound();
      fillDrawer(currentProject);
      drawerOverlay.classList.add('active');
    });

    function closeWindow() { overlay.classList.remove('active'); }
    closeBtn.addEventListener('click', closeWindow);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeWindow(); });

    function closeDrawer() { drawerOverlay.classList.remove('active'); }
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => { if (e.target === drawerOverlay) closeDrawer(); });

    /* ===== PAINEL DE PROJETOS ===== */
    const projectsOverlay = document.getElementById('projectsOverlay');
    const openProjectsBtn = document.getElementById('openProjects');
    const closeProjectsBtn = document.getElementById('closeProjects');

    function openProjects() {
      playInstantSound();
      projectsOverlay.classList.add('active');
    }
    function closeProjects() {
      projectsOverlay.classList.remove('active');
    }

    openProjectsBtn.addEventListener('pointerdown', openProjects);
    closeProjectsBtn.addEventListener('click', closeProjects);
    projectsOverlay.addEventListener('click', (e) => { if (e.target === projectsOverlay) closeProjects(); });

    /* ===== TOP MENU ===== */
    const topPedidos = document.getElementById('topPedidos');
    topPedidos.addEventListener('click', () => {
      playInstantSound();
      currentProject = 'pedidos';
      topPedidos.classList.add('active');
    });

    /* ===== DADOS DOS PRODUTOS (URLs absolutas para funcionar igual ao 432) ===== */
    const productData = {
      mercado: {
        title: 'Faço Pedidos — Mercado',
        desc: 'Carrinho rápido, categorias e checkout direto no WhatsApp.',
        url: 'https://facosites.com.br/pedidos/faco-mercado',
        modalTitle: 'FAÇO MERCADO'
      },
      hamburgueria: {
        title: 'Faço Pedidos — Hamburgueria',
        desc: 'Montagem de combos, adicionais e bebidas integrados em tempo real.',
        url: 'https://facosites.com.br/pedidos/faco-hamburguer',
        modalTitle: 'FAÇO HAMBÚRGUER'
      },
      pizzaria: {
        title: 'Faço Pedidos — Pizzaria',
        desc: 'Seleção de sabores, meio-a-meio, bordas recheadas e adicionais integrados em tempo real.',
        url: 'https://facosites.com.br/pedidos/faco-pizza',
        modalTitle: 'FAÇO PIZZA'
      },
      cafe: {
        title: 'Faço Pedidos — Café',
        desc: 'Bebidas personalizadas, grãos e acompanhamentos rápidos.',
        url: 'https://facosites.com.br/pedidos/faco-cafe',
        modalTitle: 'FAÇO CAFÉ'
      },
      petshop: {
        title: 'Faço Pedidos — Pet Shop',
        desc: 'Agendamento de banho e tosa e catálogo de rações/acessórios.',
        url: 'https://facosites.com.br/pedidos/faco-pet-shop',
        modalTitle: 'FAÇO PET SHOP'
      },
      salao: {
        title: 'Faço Pedidos — Salão',
        desc: 'Seleção de serviços, profissionais e agendamento de horários.',
        url: 'https://facosites.com.br/pedidos/faco-salao',
        modalTitle: 'FAÇO SALÃO'
      },
      sorvetes: {
        title: 'Faço Pedidos — Sorvetes',
        desc: 'Opções de copinho/casquinha, coberturas e potes para entrega.',
        url: 'https://facosites.com.br/pedidos/faco-sorvetes',
        modalTitle: 'FAÇO SORVETES'
      }
    };

    const prodPills = document.querySelectorAll('.prod-pill');
    const iconsGrid = document.getElementById('iconsGrid');
    const iconCards = document.querySelectorAll('.icon-card');
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const miniIframe = document.getElementById('miniIframe');
    const btnVerInteiro = document.getElementById('btnVerInteiro');
    const btnPedir = document.getElementById('btnPedir');

    function setActivePill(cat) {
      prodPills.forEach(p => p.classList.toggle('active', p.getAttribute('data-cat') === cat));
    }

    function showIcons(show) {
      iconsGrid.classList.toggle('hidden', !show);
    }

    function selectProduct(key) {
      const data = productData[key];
      if (!data) return;

      playInstantSound();
      currentProject = 'pedidos';
      setActivePill(key);
      showIcons(false);

      detailTitle.textContent = data.title;
      detailDesc.textContent = data.desc;

      // Preload da miniatura
      miniIframe.src = data.url;

      // Atualiza os atributos do botão "Ver inteiro" (ele já tem a classe preview-trigger)
      btnVerInteiro.setAttribute('data-url', data.url);
      btnVerInteiro.setAttribute('data-title', data.modalTitle);

      // Atualiza o link do Zap
      const msg = encodeURIComponent(`Olá! Vi o sistema ${data.modalTitle} e quero um para minha marca. Como podemos começar?`);
      btnPedir.href = `https://wa.me/5511959247588?text=${msg}`;

      detailPanel.classList.add('visible');
    }

    function showTodos() {
      setActivePill('todos');
      showIcons(true);
      detailPanel.classList.remove('visible');
      miniIframe.src = 'about:blank';
      btnVerInteiro.setAttribute('data-url', '');
      btnVerInteiro.setAttribute('data-title', '');
    }

    prodPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const cat = pill.getAttribute('data-cat');
        if (cat === 'todos') {
          playInstantSound();
          showTodos();
        } else {
          selectProduct(cat);
        }
      });
    });

    iconCards.forEach(card => {
      card.addEventListener('click', () => {
        selectProduct(card.getAttribute('data-key'));
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (drawerOverlay.classList.contains('active')) closeDrawer();
        else if (overlay.classList.contains('active')) closeWindow();
        else if (projectsOverlay.classList.contains('active')) closeProjects();
      }
    });
  </script>
