  <style>
    @font-face {
      font-family: 'Times New Roman Local';
      src: local('Times New Roman'), local('TimesNewRomanPSMT');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Times New Roman Local';
      src: local('Times New Roman Bold'), local('TimesNewRomanPS-BoldMT');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Times New Roman Local';
      src: local('Times New Roman Italic'), local('TimesNewRomanPS-ItalicMT');
      font-weight: 400;
      font-style: italic;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #141414;
      --text: #E5E0D8;
      --red-dot: #FF3B30;
      --overlay-bg: rgba(10, 10, 10, 0.88);
      --modal-bg: #1a1a1a;
      --border-color: rgba(229, 224, 216, 0.15);
      --green-status: #34c759;
      --font-ui: "SFMono-Regular", ui-monospace, "Courier New", monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F4F1EA;
        --text: #1A1A1A;
        --red-dot: #D32F2F;
        --overlay-bg: rgba(244, 241, 234, 0.88);
        --modal-bg: #F4F1EA;
        --border-color: rgba(26, 26, 26, 0.14);
        --green-status: #28a745;
      }
    }

    html, body {
      width: 100%; height: 100%; height: 100dvh; overflow: hidden;
      background-color: var(--bg); color: var(--text);
      font-family: "Times New Roman Local", "Times New Roman", Times, "Noto Serif", Georgia, serif;
      -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
    }

    main { width: 100%; height: 100%; height: 100dvh; position: relative; }

    .hero-header {
      position: absolute; top: 34vh; left: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; width: max-content; max-width: 95vw;
    }

    /* Logo SVG no hero — tamanho próximo ao do texto original */
    .logo-hero {
      width: min(68vw, 495px);
      margin-bottom: 0.12rem;
      line-height: 0;
    }
    .logo-hero svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .subtitle {
      font-size: clamp(0.95rem, 1.85vw, 1.65rem); font-style: italic; font-weight: 400;
      line-height: 1.2; opacity: 0.9; letter-spacing: 0.12em; text-align: center;
      white-space: nowrap; width: 106%; margin-left: -1%; display: block;
      margin-top: -0.08rem;
    }

    .proof {
      position: absolute; top: clamp(52vh, 56vh, 63vh); left: 50%; transform: translate(-50%, -50%);
      display: flex; justify-content: center; align-items: center; white-space: nowrap;
    }

    .proof-item {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      font-size: clamp(1rem, 1.4vw, 1.3rem); line-height: 1.35;
    }

    .cta {
      position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); text-align: center; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center;
    }

    .cta p, .proof-item span:first-child { font-size: clamp(1rem, 1.4vw, 1.3rem); font-weight: 400; }
    .cta-link {
      font-size: clamp(1rem, 1.4vw, 1.3rem); font-weight: 700; font-style: normal;
      text-transform: uppercase; letter-spacing: 0.05em; display: inline-block; margin-top: 0.2rem;
    }

    a, .preview-trigger, .drawer-trigger, .projetos-trigger, .prod-pill, .action-btn, .top-pill {
      color: var(--text); text-decoration: none; transition: opacity 0.2s ease, transform 0.2s ease;
      cursor: pointer; background: none; border: none; font-family: inherit; font-size: inherit;
      display: inline-flex; align-items: center; gap: 0.25rem; touch-action: manipulation;
    }

    a:hover, .preview-trigger:hover, .drawer-trigger:hover, .projetos-trigger:hover {
      opacity: 0.75; text-decoration: underline; text-decoration-color: var(--border-color); text-underline-offset: 4px;
    }

    .arrow-red { color: var(--text); font-style: normal; font-weight: 400; display: inline-block; transition: transform 0.2s ease; }
    a:hover .arrow-red, .preview-trigger:hover .arrow-red { transform: translateX(3px); }

    .tech-overlay {
      position: fixed; inset: 0; background-color: var(--overlay-bg);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 1300;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity; padding: 2rem;
    }
    .tech-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

    .window-container {
      width: 90vw; height: 85vh; background-color: var(--modal-bg);
      border: 1px solid var(--border-color); border-radius: 0;
      display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      overflow: hidden; transform: scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tech-overlay.active .window-container { transform: scale(1); }

    .window-header {
      height: 40px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; font-family: var(--font-ui); font-size: 0.8rem;
      background: transparent;
    }
    .window-title { opacity: 0.6; }
    .close-btn {
      background: none; border: none; color: var(--text); font-size: 1.2rem;
      cursor: pointer; opacity: 0.6; transition: opacity 0.2s;
    }
    .close-btn:hover { opacity: 1; }

    .window-body { flex: 1; position: relative; background-color: #000; }
    .window-iframe { width: 100%; height: 100%; border: none; }

    /* Barra de status inferior — mesma superfície do header (sem cinza escuro extra) */
    .window-footer {
      min-height: 40px; border-top: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.4rem 1rem; font-family: var(--font-ui); font-size: 0.75rem;
      opacity: 0.95; background: transparent; gap: 0.5rem;
    }
    .status-group { display: flex; align-items: center; gap: 0.5rem; letter-spacing: 0.05em; }
    .pulse-dot {
      width: 6px; height: 6px; background-color: var(--green-status);
      border-radius: 50%; box-shadow: 0 0 8px var(--green-status); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    .bottom-sheet-overlay {
      position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 1400;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      display: flex; justify-content: center; align-items: flex-end;
    }
    .bottom-sheet-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

    .drawer {
      width: 100%; max-width: 850px; max-height: 82vh; background-color: var(--modal-bg);
      border: 1px solid var(--border-color); border-bottom: none; border-radius: 0;
      padding: 2.2rem; box-shadow: 0 -20px 40px rgba(0,0,0,0.35);
      transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto; text-align: left; font-family: var(--font-ui);
    }
    .bottom-sheet-overlay.active .drawer { transform: translateY(0); }

    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.8rem;
    }
    .drawer-title { font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6; }

    .tech-stack-details {
      font-family: "Times New Roman Local", "Times New Roman", Times, Georgia, serif;
      font-size: 0.98rem; line-height: 1.65; opacity: 0.9;
      display: flex; flex-direction: column; gap: 1.2rem;
    }
    .tech-stack-details h4 {
      font-family: var(--font-ui); font-size: 0.8rem; text-transform: uppercase;
      letter-spacing: 0.05em; opacity: 0.55; margin-bottom: -0.4rem;
    }

    .drawer-footer-brand {
      border-top: 1px solid var(--border-color); margin-top: 2rem; padding-top: 1.2rem;
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem;
    }

    /* Logo SVG no rodapé do drawer */
    .modal-brand-logo {
      display: block;
      width: min(180px, 42vw);
      line-height: 0;
      flex-shrink: 0;
    }
    .modal-brand-logo svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .modal-brand-cta {
      font-family: "Times New Roman Local", "Times New Roman", Times, Georgia, serif;
      font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .projects-overlay {
      position: fixed; inset: 0; background-color: var(--overlay-bg);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 1100;
      display: flex; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 2rem;
    }
    .projects-overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

    .projects-container {
      width: 90vw; max-width: 820px; height: 85vh; max-height: 780px;
      background-color: var(--modal-bg); border: 1px solid var(--border-color); border-radius: 0;
      display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      overflow: hidden; transform: scale(0.96);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .projects-overlay.active .projects-container { transform: scale(1); }

    .projects-header {
      height: 40px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem; font-family: var(--font-ui); font-size: 0.8rem; flex-shrink: 0;
      background: transparent;
    }
    .projects-header-left { display: flex; align-items: center; gap: 0.6rem; }
    .projects-body { flex: 1; overflow-y: auto; padding: 1.6rem 2rem 2.2rem; }

    .top-menu {
      display: flex; gap: 0.5rem; margin-bottom: 1.6rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--border-color); padding-bottom: 1.4rem;
    }
    .top-pill {
      font-family: var(--font-ui); font-size: 0.8rem; padding: 0.55rem 1.05rem;
      border: 1px solid var(--border-color); border-radius: 0; opacity: 0.5;
      transition: all 0.2s ease; white-space: nowrap;
    }
    .top-pill:hover { opacity: 0.85; background: rgba(0,0,0,0.03); }
    .top-pill.active { opacity: 1; border-color: var(--text); background: transparent; font-weight: 700; }

    .pedidos-view { display: none; }
    .pedidos-view.active { display: block; }

    .section-sub {
      font-family: var(--font-ui); font-size: 0.78rem; font-style: normal;
      font-weight: 400; letter-spacing: 0.03em; text-transform: uppercase;
      opacity: 0.5; margin-bottom: 1.3rem;
    }

    .prod-scroll {
      display: flex; gap: 1.1rem; overflow-x: auto; padding-bottom: 0.8rem;
      margin-bottom: 1.3rem; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
      border-bottom: 1px solid var(--border-color);
    }
    .prod-scroll::-webkit-scrollbar { height: 3px; }
    .prod-scroll::-webkit-scrollbar-thumb { background: var(--border-color); }

    .prod-pill {
      flex-shrink: 0; font-family: var(--font-ui); font-size: 0.78rem;
      padding: 0 0 0.15rem; border: none; border-radius: 0; opacity: 0.5;
      background: none; white-space: nowrap; font-weight: 400;
      text-decoration: none; transition: opacity 0.2s ease;
    }
    .prod-pill:hover { opacity: 0.85; background: none; }
    .prod-pill.active {
      opacity: 1; font-weight: 700; text-decoration: underline;
      text-underline-offset: 5px; text-decoration-thickness: 1.5px;
    }

    .icons-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.65rem; margin-bottom: 1.4rem; transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .icons-grid.hidden { display: none; }

    .icon-card {
      border: 1px solid var(--border-color); border-radius: 0; padding: 1.1rem 0.4rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.5rem; cursor: pointer; background: transparent;
      transition: all 0.2s ease; text-align: center;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }
    .icon-card:hover { border-color: var(--text); background: rgba(0,0,0,0.03); opacity: 1; text-decoration: none; color: var(--text); }
    .icon-card.active-card { border-color: var(--text); }
    .icon-card svg {
      width: 24px; height: 24px;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .icon-card span {
      font-family: var(--font-ui); font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.01em; color: var(--text);
    }

    .detail-panel {
      border: none; border-top: 1px solid var(--border-color); border-radius: 0;
      padding: 1.4rem 0 0; background: transparent; opacity: 0; transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none;
    }
    .detail-panel.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .detail-panel h3 {
      font-family: "Times New Roman Local", "Times New Roman", Times, Georgia, serif;
      font-size: 1.2rem; font-weight: 700; margin-bottom: 0.3rem;
    }
    .detail-panel p {
      font-family: var(--font-ui); font-size: 0.75rem; opacity: 0.55;
      margin-bottom: 1.1rem; line-height: 1.5;
    }

    .mini-preview-wrap {
      width: 100%; height: 160px; border: 1px solid var(--border-color);
      border-radius: 0; overflow: hidden; background: #000; position: relative; margin-bottom: 1rem;
    }
    .mini-preview-wrap iframe {
      width: 200%; height: 200%; border: none; transform: scale(0.5);
      transform-origin: top left; pointer-events: none;
    }

    .mini-actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }
    .action-btn {
      font-family: var(--font-ui); font-size: 0.78rem; padding: 0.6rem 1.1rem;
      border: 1px solid var(--border-color); border-radius: 0; transition: all 0.2s ease;
      font-weight: 400;
    }
    .action-btn:hover { border-color: var(--text); background: rgba(0,0,0,0.03); opacity: 1; text-decoration: none; }
    .action-btn.primary { border-color: var(--text); background: var(--text); color: var(--modal-bg); }
    .action-btn.primary:hover { opacity: 0.85; background: var(--text); }
    .action-btn.primary .arrow-red { color: var(--modal-bg); }

    @media (max-width: 640px) {
      .hero-header { top: 32vh; }
      .logo-hero { width: min(78vw, 300px); }
      .subtitle { font-size: 0.72rem; width: 104%; }
      .proof { top: 54vh; }
      .cta { bottom: calc(20px + env(safe-area-inset-bottom)); }
      .tech-overlay, .projects-overlay { padding: 0.8rem; }
      .window-container { width: 100%; height: 88vh; }
      .projects-container { width: 100%; height: 88vh; max-height: none; }
      .projects-body { padding: 1.3rem 1.2rem 1.8rem; }
      .window-footer { font-size: 0.65rem; }
      .drawer { padding: 1.4rem; }
      .icons-grid { grid-template-columns: repeat(3, 1fr); }
      .mini-preview-wrap { height: 140px; }
      .modal-brand-logo { width: min(140px, 38vw); }
    }
  </style>

  <script>
    function updateThemeColor() {
      const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const themeColor = isDarkMode ? '#141414' : '#F4F1EA';
      let metaTheme = document.querySelector('meta[name="theme-color"]');
      if (!metaTheme) {
        metaTheme = document.createElement('meta');
        metaTheme.name = 'theme-color';
        document.head.appendChild(metaTheme);
      }
      metaTheme.setAttribute('content', themeColor);
    }

    let audioCtx = null;
    let audioBuffer = null;

    async function initAudioEngine() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const response = await fetch('katana-draw.mp3');
        const arrayBuffer = await response.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateThemeColor();
    });

    let audioReady = false;
    function ensureAudio() {
      if (!audioReady) {
        audioReady = true;
        initAudioEngine();
      }
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor);

    function playInstantSound() {
      ensureAudio();
      if (audioCtx && audioBuffer) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.7;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
      } else {
        const fallback = new Audio('katana-draw.mp3');
        fallback.volume = 0.7;
        fallback.play().catch(() => {});
      }
    }

    const overlay = document.getElementById('techOverlay');
    const iframe = document.getElementById('previewIframe');
    const titleEl = document.getElementById('overlayTitle');
    const closeBtn = document.getElementById('closeOverlay');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const openDrawerBtn = document.getElementById('openDrawer');
    const closeDrawerBtn = document.getElementById('closeDrawer');

    let currentProject = 'pedidos';

    document.addEventListener('pointerdown', (e) => {
      const trigger = e.target.closest('.preview-trigger');
      if (!trigger) return;

      const url = trigger.getAttribute('data-url');
      const siteTitle = trigger.getAttribute('data-title');

      if (url && url !== '') {
        playInstantSound();
        if (url.includes('432up.com')) {
          currentProject = 'mundos';
        } else if (url.includes('/pedidos/')) {
          currentProject = 'pedidos';
        }
        iframe.src = url;
        titleEl.textContent = siteTitle || 'PREVIEW';
        overlay.classList.add('active');
      }
    });

    const projectContents = {
      pedidos: {
        title: '// FAÇO PEDIDOS',
        html: `
          <h4>FAÇO PEDIDOS</h4>
          <p>Pedidos mais simples. Para quem vende e para quem compra.</p>
          <p>O FAÇO PEDIDOS foi criado para uma dor muito comum de pequenos e médios negócios de alimentação: o cliente quer pedir, mas o caminho até o pedido é complicado.</p>
          <p>Hamburguerias, pizzarias, sorveterias, cafés, mercados e outros negócios muitas vezes acabam dependendo de mensagens no WhatsApp, cardápios confusos ou marketplaces que colocam outra camada entre o estabelecimento e seu cliente.</p>
          <p>O FAÇO PEDIDOS transforma esse processo em uma experiência simples e direta. A ideia é levar o cliente do “quero pedir” até “pedido feito” com o menor número possível de etapas.</p>

          <h4>UM TOQUE</h4>
          <p>A experiência foi pensada para o toque. Menos telas. Menos menus. Menos dúvidas. Menos caminhos desnecessários. Um toque → uma decisão → próximo passo. O objetivo é simplificar a vida de quem está fazendo o pedido.</p>

          <h4>DO TOTEM AO CELULAR</h4>
          <p>O mesmo sistema pode funcionar dentro do estabelecimento, em um totem de autoatendimento, e também no celular do cliente. Isso significa que o cliente pode fazer seu pedido no estabelecimento, pelo próprio celular, de casa, pelo link enviado pelo negócio, e também continuar utilizando o WhatsApp quando essa for a melhor opção.</p>
          <p>A proposta não é obrigar o comerciante a abandonar o WhatsApp. É facilitar o pedido e levar o cliente até a conclusão com muito menos atrito.</p>

          <h4>WHATSAPP SEM A CONVERSA INFINITA</h4>
          <p>Para muitos pequenos negócios, o WhatsApp ainda é o principal canal de vendas. Mas existe uma diferença entre “me manda o cardápio, espera eu responder, escolhe, pergunta preço, confirma endereço…” e uma experiência em que o cliente simplesmente toca → escolhe → confirma → envia.</p>
          <p>O FAÇO PEDIDOS pode organizar essa jornada antes que ela chegue ao atendimento humano. Assim, o WhatsApp continua sendo parte da operação — mas deixa de carregar sozinho todo o trabalho de montar o pedido.</p>

          <h4>SEU PEDIDO. SEU CLIENTE. SUA VENDA.</h4>
          <p>Marketplaces podem ser úteis para conquistar novos clientes. Mas depender exclusivamente deles significa aceitar suas regras, sua experiência e suas taxas. O FAÇO PEDIDOS permite ao estabelecimento criar uma experiência própria de pedidos e vender diretamente ao seu cliente.</p>
          <p>É uma alternativa para quem quer reduzir a dependência de plataformas de terceiros e ter mais controle sobre sua própria operação digital. Em vez de pagar uma comissão recorrente sobre cada venda para simplesmente receber o pedido, o negócio pode ter seu próprio sistema de pedidos. Seu cliente entra pela sua porta digital.</p>

          <h4>SEU PRÓPRIO CANAL DE PEDIDOS</h4>
          <p>O FAÇO PEDIDOS não precisa ser apresentado como “um novo iFood”. A proposta é diferente. É uma ferramenta própria para o negócio vender diretamente.</p>
          <p>Para o comerciante que está cansado de depender de aplicativos, pagar taxas elevadas sobre pedidos e ainda precisar administrar conversas manualmente no WhatsApp, existe outra possibilidade: ter seu próprio canal de pedidos.</p>
          <p>Marketplaces podem cobrar taxas e comissões que pesam sobre cada venda. O foco não é atacar nenhuma empresa. O foco é mostrar que existe uma alternativa: venda direta, experiência própria e mais controle.</p>

          <h4>PARA QUEM FOI FEITO</h4>
          <p>O FAÇO PEDIDOS foi pensado especialmente para negócios como hamburguerias, pizzarias, sorveterias, cafés, mercados, lanchonetes, restaurantes, lojas de alimentação e pequenos negócios que recebem pedidos pelo WhatsApp. É especialmente interessante para quem já vende pelo WhatsApp, mas percebe que o processo está ficando trabalhoso.</p>

          <h4>A IDEIA CENTRAL</h4>
          <p>Não é criar mais uma tela. É eliminar etapas. Não é afastar o cliente. É aproximá-lo do pedido. Não é substituir obrigatoriamente o WhatsApp. É tornar o caminho até ele mais simples. Não é depender de um marketplace. É possibilitar que o negócio tenha sua própria experiência digital de pedidos.</p>
          <p><strong>Menos conversa para montar o pedido. Mais facilidade para fazer o pedido.</strong></p>
        `
      },
      mundos: {
        title: '// FAÇO MUNDOS DIGITAIS',
        html: `
          <h4>FAÇO MUNDOS DIGITAIS</h4>
          <p>Sites que não são apenas páginas. São lugares digitais.</p>
          <p>O FAÇO MUNDOS DIGITAIS cria experiências digitais com identidade, interação, narrativa e propósito.</p>
          <p>Em vez de simplesmente colocar informações em uma página, a proposta é pensar: como essa pessoa vai entrar, descobrir, navegar, interagir e sair dessa experiência?</p>
          <p>Cada projeto pode possuir sua própria linguagem, estrutura, atmosfera e lógica. O site deixa de ser apenas uma vitrine. Pode se transformar em experiência de marca, universo narrativo, apresentação interativa, produto digital, experiência comercial, projeto especial ou ambiente digital personalizado.</p>

          <h4>A IDEIA</h4>
          <p>Se a internet é um espaço, por que todo site precisa parecer uma página?</p>
          <p>O FAÇO MUNDOS DIGITAIS existe para criar experiências que tenham um lugar próprio na web.</p>
          <p><strong>Não é apenas estar na internet. É criar um lugar para estar nela.</strong></p>
        `
      }
    };

    function fillDrawer(projectKey) {
      const data = projectContents[projectKey] || projectContents.pedidos;
      document.getElementById('drawerTitle').textContent = data.title;
      document.getElementById('drawerContent').innerHTML = data.html;
    }

    openDrawerBtn.addEventListener('pointerdown', () => {
      playInstantSound();
      fillDrawer(currentProject);
      drawerOverlay.classList.add('active');
    });

    function closeWindow() { overlay.classList.remove('active'); }
    closeBtn.addEventListener('click', closeWindow);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeWindow(); });

    function closeDrawer() { drawerOverlay.classList.remove('active'); }
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => { if (e.target === drawerOverlay) closeDrawer(); });

    const projectsOverlay = document.getElementById('projectsOverlay');

    function openProjects() {
      playInstantSound();
      projectsOverlay.classList.add('active');
    }
    function closeProjects() {
      projectsOverlay.classList.remove('active');
    }

    openProjectsBtn.addEventListener('pointerdown', openProjects);
    closeProjectsBtn.addEventListener('click', closeProjects);
    projectsOverlay.addEventListener('click', (e) => { if (e.target === projectsOverlay) closeProjects(); });

    const topPedidos = document.getElementById('topPedidos');
    topPedidos.addEventListener('click', () => {
      playInstantSound();
      currentProject = 'pedidos';
      topPedidos.classList.add('active');
    });

    const productData = {
      mercado: {
        title: 'Faço Pedidos — Mercado',

    const prodPills = document.querySelectorAll('.prod-pill');
    const iconsGrid = document.getElementById('iconsGrid');
    const iconCards = document.querySelectorAll('.icon-card');
    const detailPanel = document.getElementById('detailPanel');
    const detailTitle = document.getElementById('detailTitle');
    const detailDesc = document.getElementById('detailDesc');
    const miniIframe = document.getElementById('miniIframe');
    const btnVerInteiro = document.getElementById('btnVerInteiro');
    const btnPedir = document.getElementById('btnPedir');

    function setActivePill(cat) {
      prodPills.forEach(p => p.classList.toggle('active', p.getAttribute('data-cat') === cat));
    }

    function showIcons(show) {
      iconsGrid.classList.toggle('hidden', !show);
    }

    function selectProduct(key) {
      const data = productData[key];
      if (!data) return;

      playInstantSound();
      currentProject = 'pedidos';
      setActivePill(key);
      showIcons(false);

      detailTitle.textContent = data.title;
      detailDesc.textContent = data.desc;

      miniIframe.src = data.url;

      btnVerInteiro.setAttribute('data-url', data.url);
      btnVerInteiro.setAttribute('data-title', data.modalTitle);

      const msg = encodeURIComponent(`Olá! Vi o sistema ${data.modalTitle} e quero um para minha marca. Como podemos começar?`);
      btnPedir.href = `https://wa.me/5511959247588?text=${msg}`;

      detailPanel.classList.add('visible');
    }

    function showTodos() {
      setActivePill('todos');
      showIcons(true);
      detailPanel.classList.remove('visible');
      miniIframe.src = 'about:blank';
      btnVerInteiro.setAttribute('data-url', '');
      btnVerInteiro.setAttribute('data-title', '');
    }

    prodPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const cat = pill.getAttribute('data-cat');
        if (cat === 'todos') {
          playInstantSound();
          showTodos();
        } else {
          selectProduct(cat);
        }
      });
    });

    iconCards.forEach(card => {
      card.addEventListener('click', () => {
        selectProduct(card.getAttribute('data-key'));
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (drawerOverlay.classList.contains('active')) closeDrawer();
        else if (overlay.classList.contains('active')) closeWindow();
        else if (projectsOverlay.classList.contains('active')) closeProjects();
      }
    });
  </script>
